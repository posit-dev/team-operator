# Test secrets for cloud-agnostic development on kind
#
# These K8s Secrets contain dummy values for all product secret keys.
# In production, these would be synced from AWS Secrets Manager or Azure Key Vault
# via external-secrets-operator.

---
# Product secrets (licenses, tokens, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: dev-secrets
  namespace: posit-team
type: Opaque
stringData:
  # Connect secret key
  pub-secret-key: "test-secret-key-connect"

  # Database password
  pub-db-password: "test-db-password"

  # Product licenses (empty for testing)
  pub.lic: ""
  dev.lic: ""
  ppm.lic: ""

  # Keycloak admin credentials
  keycloak-admin-user: "admin"
  keycloak-admin-password: "test-admin-password"

  # OAuth2 secrets
  oauth2-client-id: "test-client-id"
  oauth2-client-secret: "test-client-secret"

---
# Workload secrets (environment-specific secrets)
apiVersion: v1
kind: Secret
metadata:
  name: dev-workload-secrets
  namespace: posit-team
type: Opaque
stringData:
  # AWS credentials (not used in kind, but required by schema)
  aws-access-key-id: "test-access-key"
  aws-secret-access-key: "test-secret-key"

  # Azure credentials (not used in kind)
  azure-client-id: "test-client-id"
  azure-client-secret: "test-client-secret"
  azure-tenant-id: "test-tenant-id"

  # Generic secrets
  api-key: "test-api-key"

---
# Database credentials
apiVersion: v1
kind: Secret
metadata:
  name: dev-db-creds
  namespace: posit-team
type: Opaque
stringData:
  username: "postgres"
  password: "test-db-password"
  host: "postgresql.default.svc.cluster.local"
  port: "5432"
  database: "postgres"
  url: "postgresql://postgres:test-db-password@postgresql.default.svc.cluster.local:5432/postgres?sslmode=disable"

---
# License secrets (separate from product secrets for flexibility)
apiVersion: v1
kind: Secret
metadata:
  name: license
  namespace: posit-team
type: Opaque
stringData:
  # Empty license files for testing
  # In production, these would contain actual RSA licenses
  pub.lic: ""
  dev.lic: ""
  ppm.lic: ""
