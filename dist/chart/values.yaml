## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Namespace where the operator watches for Site CRs
## This must match the WATCH_NAMESPACES environment variable
watchNamespace: posit-team

## Configure the controller manager deployment
##
manager:
  replicas: 1

  image:
    repository: posit/team-operator
    tag: latest
    pullPolicy: IfNotPresent

  ## Arguments passed to the manager binary (in addition to metrics and health-probe
  ## bind addresses which are managed by the chart template directly)
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: WATCH_NAMESPACES
      value: "posit-team"

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## ServiceAccount configuration
  ##
  serviceAccount:
    # Annotations to add to the service account (e.g., for EKS IAM roles)
    annotations: {}

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

