{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/serving-cert"
    {{- end }}
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.17.0
  name: packagemanagers.core.posit.team
spec:
  {{- if .Values.webhook.enable }}
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: {{ .Release.Namespace }}
          name: webhook-service
          path: /convert
      conversionReviewVersions:
      - v1
  {{- end }}
  group: core.posit.team
  names:
    kind: PackageManager
    listKind: PackageManagerList
    plural: packagemanagers
    shortNames:
    - pm
    - pms
    singular: packagemanager
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: PackageManager is the Schema for the packagemanagers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PackageManagerSpec defines the desired state of PackageManager
            properties:
              addEnv:
                additionalProperties:
                  type: string
                description: |-
                  AddEnv adds arbitrary environment variables to the container env

                  Deprecated: use envVars instead. If the same variable name is set in both
                  addEnv and envVars, envVars takes precedence: it is rendered after addEnv,
                  and Kubernetes resolves a duplicate env var name to the last occurrence.
                type: object
              awsAccountId:
                description: AwsAccountId is the account Id for this AWS Account.
                  It is used to create EKS-to-IAM annotations
                type: string
              azureFiles:
                description: AzureFiles configures Azure Files integration for persistent
                  storage
                properties:
                  shareSizeGiB:
                    description: ShareSizeGiB is the size of the Azure File Share
                      to create
                    type: integer
                  storageClassName:
                    description: StorageClassName is the name of the Kubernetes StorageClass
                      that uses the Azure Files CSI driver
                    type: string
                type: object
              chronicleImage:
                description: ChronicleAgentImage is the image used for the Chronicle
                  Agent
                type: string
              clusterDate:
                description: ClusterDate is the date id (YYYYmmdd) for the cluster.
                  It is used to create EKS-to-IAM annotations
                type: string
              config:
                properties:
                  Authentication:
                    properties:
                      APITokenAuth:
                        type: boolean
                      CookieSweepDuration:
                        type: string
                      DeviceAuthType:
                        type: string
                      Inactivity:
                        type: string
                      Lifetime:
                        type: string
                      NewReposAuthByDefault:
                        type: boolean
                    type: object
                  CRAN:
                    description: 'PackageManagerCRANConfig is deprecated TODO: deprecated!
                      We will remove this soon!'
                    properties:
                      RSF:
                        type: boolean
                    type: object
                  Database:
                    properties:
                      Provider:
                        type: string
                    type: object
                  Debug:
                    properties:
                      Log:
                        type: string
                    type: object
                  Git:
                    properties:
                      AllowUnsandboxedGitBuilds:
                        type: boolean
                    type: object
                  Http:
                    properties:
                      Listen:
                        type: string
                    type: object
                  Metrics:
                    properties:
                      Enabled:
                        type: boolean
                    type: object
                  OpenIDConnect:
                    properties:
                      ClientId:
                        type: string
                      ClientSecret:
                        type: string
                      ClientSecretFile:
                        type: string
                      CustomScope:
                        type: string
                      DisablePKCE:
                        type: boolean
                      EnableDevicePKCE:
                        type: boolean
                      GroupsClaim:
                        type: string
                      GroupsSeparator:
                        type: string
                      Issuer:
                        type: string
                      Logging:
                        type: boolean
                      MaxAuthenticationAge:
                        type: string
                      NoAutoGroupsScope:
                        type: boolean
                      RequireLogin:
                        type: boolean
                      RoleClaim:
                        type: string
                      RolesSeparator:
                        type: string
                      Scope:
                        type: string
                      TokenLifetime:
                        type: string
                      UniqueIdClaim:
                        type: string
                      UsernameClaim:
                        type: string
                    type: object
                  Postgres:
                    properties:
                      URL:
                        type: string
                      UsageDataURL:
                        type: string
                    type: object
                  Repos:
                    properties:
                      Bioconductor:
                        type: string
                      CRAN:
                        type: string
                      PyPI:
                        type: string
                    type: object
                  S3Storage:
                    properties:
                      Bucket:
                        type: string
                      Prefix:
                        type: string
                      Region:
                        type: string
                    type: object
                  Server:
                    properties:
                      AccessLog:
                        type: string
                      AccessLogFormat:
                        type: string
                      Address:
                        type: string
                      DataDir:
                        type: string
                      LauncherDir:
                        type: string
                      RVersion:
                        items:
                          type: string
                        type: array
                    type: object
                  Storage:
                    properties:
                      Default:
                        type: string
                    type: object
                  additionalConfig:
                    description: |-
                      AdditionalConfig allows appending arbitrary gcfg config content not covered by typed fields.
                      The value is appended verbatim after the generated config. gcfg parsing naturally handles
                      conflicts: list values are combined, scalar values use the last occurrence.
                    type: string
                type: object
              databaseConfig:
                properties:
                  dropOnTeardown:
                    type: boolean
                  host:
                    type: string
                  instrumentationSchema:
                    type: string
                  schema:
                    type: string
                  sslMode:
                    type: string
                type: object
              envVars:
                description: EnvVars adds environment variables to the container,
                  supporting valueFrom (e.g. secretKeyRef).
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              gitSSHKeys:
                description: |-
                  GitSSHKeys defines SSH key configurations for Git authentication
                  This is used for mounting SSH keys but not included in the .gcfg file
                items:
                  description: SSHKeyConfig defines SSH key configuration for Git
                    authentication
                  properties:
                    host:
                      description: |-
                        Host is the Git host domain this key applies to
                        Example: "github.com"
                      type: string
                    name:
                      description: Name is a unique identifier for this SSH key configuration
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    passphraseSecretRef:
                      description: PassphraseSecretRef optionally references a secret
                        containing the passphrase for an encrypted SSH key
                      properties:
                        key:
                          description: |-
                            Key is the specific key within the secret (primarily for Kubernetes secrets)
                            For AWS/Azure: usually not needed as the entire secret is used
                            For Kubernetes: the key within the Secret data
                          type: string
                        name:
                          description: |-
                            Name is the secret name
                            For AWS: secret name in AWS Secrets Manager (e.g., "ptd/cluster/packagemanager/ssh/github")
                            For Kubernetes: secret name in the same namespace
                            For Azure: key vault secret name
                          minLength: 1
                          type: string
                        source:
                          description: Source specifies the secret management system
                          enum:
                          - aws-secrets-manager
                          - kubernetes
                          - azure-key-vault
                          type: string
                      required:
                      - name
                      - source
                      type: object
                    secretRef:
                      description: SecretRef references the secret containing the
                        SSH private key
                      properties:
                        key:
                          description: |-
                            Key is the specific key within the secret (primarily for Kubernetes secrets)
                            For AWS/Azure: usually not needed as the entire secret is used
                            For Kubernetes: the key within the Secret data
                          type: string
                        name:
                          description: |-
                            Name is the secret name
                            For AWS: secret name in AWS Secrets Manager (e.g., "ptd/cluster/packagemanager/ssh/github")
                            For Kubernetes: secret name in the same namespace
                            For Azure: key vault secret name
                          minLength: 1
                          type: string
                        source:
                          description: Source specifies the secret management system
                          enum:
                          - aws-secrets-manager
                          - kubernetes
                          - azure-key-vault
                          type: string
                      required:
                      - name
                      - source
                      type: object
                  required:
                  - host
                  - name
                  - secretRef
                  type: object
                type: array
              image:
                type: string
              imagePullPolicy:
                description: PullPolicy describes a policy for if/when to pull a container
                  image
                type: string
              imagePullSecrets:
                description: |-
                  ImagePullSecrets is a set of image pull secrets to use for all image pulls. These names / secrets
                  must already exist in the namespace in question.
                items:
                  type: string
                type: array
              ingressAnnotations:
                additionalProperties:
                  type: string
                description: IngressAnnotations is a set of annotations to be applied
                  to all ingress routes
                type: object
              ingressClass:
                description: IngressClass is the ingress class to be used when creating
                  ingress routes
                type: string
              license:
                properties:
                  existingSecretKey:
                    type: string
                  existingSecretName:
                    type: string
                  key:
                    type: string
                  type:
                    type: string
                type: object
              mainDatabaseCredentialSecret:
                description: MainDatabaseCredentialSecret configures the secret used
                  for storing the main database credentials
                properties:
                  type:
                    type: string
                  vaultName:
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              oidcClientSecretKey:
                description: |-
                  OIDCClientSecretKey is the key name in the vault for the OIDC client secret.
                  When set, the client secret will be mounted at /etc/rstudio-pm/oidc-client-secret
                type: string
              replicas:
                type: integer
              secret:
                description: Secret configures the secret management for this PackageManager
                properties:
                  type:
                    type: string
                  vaultName:
                    type: string
                type: object
              secretType:
                type: string
              sleep:
                description: |-
                  Sleep puts the service to sleep... so you can debug a crash looping container / etc. It is an ugly escape hatch,
                  but can also be useful on occasion
                type: boolean
              suspended:
                description: |-
                  Suspended indicates Package Manager should not run serving resources (Deployment, Service, Ingress)
                  but should preserve data resources (PVC, database, secrets). Set by the Site controller.
                type: boolean
              url:
                type: string
              volume:
                description: VolumeSpec is a specification for a PersistentVolumeClaim
                  to be created (and/or mounted)
                properties:
                  accessModes:
                    description: AccessModes is the access mode for the created PVC.
                      Only used if Create is true
                    items:
                      type: string
                    type: array
                  create:
                    description: Create determines whether the PVC should be created
                      or not
                    type: boolean
                  mountPath:
                    description: MountPath is not always used. It is only used for
                      volumes that are configurable... (i.e. additionalVolumes)
                    type: string
                  pvcName:
                    description: PvcName is used only if Create is false. The idea
                      is that the PVC has already been created. Only used if Create
                      is false
                    type: string
                  readOnly:
                    description: ReadOnly defaults to false and determines whether
                      the volume is mounted ReadOnly
                    type: boolean
                  size:
                    description: Size is the size of the PVC that is being created.
                      Only used if Create is true
                    type: string
                  storageClassName:
                    description: StorageClassName identifies the StorageClassName
                      created by the PV. Only used if Create is true
                    type: string
                  volumeName:
                    description: VolumeName is the name of the PV that will be referenced
                      by the created PVC. Only used if Create is true
                    type: string
                type: object
              workloadCompoundName:
                description: WorkloadCompoundName is the name for the workload
                type: string
              workloadSecret:
                description: WorkloadSecret configures the managed persistent secret
                  for the entire workload account
                properties:
                  type:
                    type: string
                  vaultName:
                    type: string
                type: object
            type: object
          status:
            description: PackageManagerStatus defines the observed state of PackageManager
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              keySecretRef:
                description: |-
                  SecretReference represents a Secret Reference. It has enough information to retrieve secret
                  in any namespace
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed for this resource.
                  It corresponds to the resource's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              ready:
                type: boolean
              version:
                description: Version is the version of the product image being deployed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
