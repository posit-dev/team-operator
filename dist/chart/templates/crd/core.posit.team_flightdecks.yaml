{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.17.0
  name: flightdecks.core.posit.team
spec:
  group: core.posit.team
  names:
    kind: Flightdeck
    listKind: FlightdeckList
    plural: flightdecks
    singular: flightdeck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Flightdeck is the Schema for the flightdecks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FlightdeckSpec defines the desired state of Flightdeck
            properties:
              awsAccountId:
                description: AwsAccountId is the AWS account ID (used for EKS-to-IAM
                  annotations)
                type: string
              clusterDate:
                description: ClusterDate is the cluster date ID (used for EKS-to-IAM
                  annotations)
                type: string
              domain:
                description: Domain is the domain name for Flightdeck ingress
                type: string
              featureEnabler:
                description: FeatureEnabler controls which features are enabled in
                  Flightdeck
                properties:
                  showAcademy:
                    default: false
                    description: ShowAcademy enables the academy page
                    type: boolean
                  showConfig:
                    default: false
                    description: ShowConfig enables the configuration page
                    type: boolean
                type: object
              image:
                description: Image is the container image for Flightdeck
                type: string
              imagePullPolicy:
                description: ImagePullPolicy controls when the kubelet pulls the image
                type: string
              imagePullSecrets:
                description: ImagePullSecrets are references to secrets for pulling
                  images
                items:
                  type: string
                type: array
              ingressAnnotations:
                additionalProperties:
                  type: string
                description: IngressAnnotations are annotations to apply to the ingress
                type: object
              ingressClass:
                description: IngressClass is the ingress class to use
                type: string
              logFormat:
                default: text
                description: LogFormat sets the log output format (text, json)
                type: string
              logLevel:
                default: info
                description: LogLevel sets the logging verbosity (debug, info, warn,
                  error)
                type: string
              port:
                default: 8080
                description: Port is the port that the container will listen on
                format: int32
                type: integer
              replicas:
                default: 1
                description: Replicas is the number of Flightdeck pods to run
                type: integer
              siteName:
                description: SiteName is the name of the Site that owns this Flightdeck
                  instance
                type: string
              workloadCompoundName:
                description: WorkloadCompoundName is the workload name
                type: string
            type: object
          status:
            description: FlightdeckStatus defines the observed state of Flightdeck
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed for this resource.
                  It corresponds to the resource's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              ready:
                description: Ready indicates whether the Flightdeck deployment is
                  ready
                type: boolean
              version:
                description: Version is the version of the product image being deployed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
