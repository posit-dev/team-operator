{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/serving-cert"
    {{- end }}
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.17.0
  name: chronicles.core.posit.team
spec:
  {{- if .Values.webhook.enable }}
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: {{ .Release.Namespace }}
          name: webhook-service
          path: /convert
      conversionReviewVersions:
      - v1
  {{- end }}
  group: core.posit.team
  names:
    kind: Chronicle
    listKind: ChronicleList
    plural: chronicles
    shortNames:
    - pcr
    - chr
    singular: chronicle
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Chronicle is the Schema for the chronicles API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChronicleSpec defines the desired state of Chronicle
            properties:
              addEnv:
                additionalProperties:
                  type: string
                description: AddEnv adds arbitrary environment variables to the container
                  env
                type: object
              awsAccountId:
                description: AwsAccountId is the account Id for this AWS Account.
                  It is used to create EKS-to-IAM annotations
                type: string
              clusterDate:
                description: ClusterDate is the date id (YYYYmmdd) for the cluster.
                  It is used to create EKS-to-IAM annotations
                type: string
              config:
                properties:
                  Http:
                    properties:
                      Listen:
                        type: string
                    type: object
                  LocalStorage:
                    properties:
                      Enabled:
                        type: boolean
                      Location:
                        type: string
                    type: object
                  Logging:
                    properties:
                      ServiceLog:
                        type: string
                      ServiceLogFormat:
                        type: string
                      ServiceLogLevel:
                        type: string
                    type: object
                  Metrics:
                    properties:
                      Enabled:
                        type: boolean
                      Listen:
                        type: string
                    type: object
                  Profiling:
                    properties:
                      Enabled:
                        type: boolean
                      Listen:
                        type: string
                    type: object
                  S3Storage:
                    properties:
                      Bucket:
                        type: string
                      Enabled:
                        type: boolean
                      Prefix:
                        type: string
                      Region:
                        type: string
                    type: object
                type: object
              image:
                type: string
              imagePullSecrets:
                description: |-
                  ImagePullSecrets is a set of image pull secrets to use for all image pulls. These names / secrets
                  must already exist in the namespace in question.
                items:
                  type: string
                type: array
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              suspended:
                description: |-
                  Suspended indicates Chronicle should not run serving resources (StatefulSet, Service)
                  but should preserve configuration. Set by the Site controller.
                type: boolean
              workloadCompoundName:
                description: WorkloadCompoundName is the name for the workload
                type: string
            type: object
          status:
            description: ChronicleStatus defines the observed state of Chronicle
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed for this resource.
                  It corresponds to the resource's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              ready:
                type: boolean
              version:
                description: Version is the version of the product image being deployed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
