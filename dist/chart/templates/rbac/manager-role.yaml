apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/component: rbac
        app.kubernetes.io/created-by: team-operator
        app.kubernetes.io/instance: manager-role
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: clusterrole
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/part-of: team-operator
    name: {{ include "team-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
    - apiGroups:
        - ""
      resources:
        - persistentvolumes
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        app.kubernetes.io/component: rbac
        app.kubernetes.io/created-by: team-operator
        app.kubernetes.io/instance: manager-role
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: role
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/part-of: team-operator
    name: {{ include "team-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
    namespace: {{ .Values.watchNamespace }}
rules:
    - apiGroups:
        - ""
      resources:
        - configmaps
        - persistentvolumeclaims
        - pods
        - pods/attach
        - pods/exec
        - secrets
        - serviceaccounts
        - services
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - watch
    - apiGroups:
        - ""
      resources:
        - pods/log
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - apps
      resources:
        - daemonsets
        - deployments
        - statefulsets
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - batch
      resources:
        - jobs
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - core.posit.team
      resources:
        - chronicles
        - connects
        - flightdecks
        - packagemanagers
        - postgresdatabases
        - sites
        - workbenches
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - core.posit.team
      resources:
        - chronicles/finalizers
        - connects/finalizers
        - flightdecks/finalizers
        - packagemanagers/finalizers
        - postgresdatabases/finalizers
        - sites/finalizers
        - workbenches/finalizers
      verbs:
        - update
    - apiGroups:
        - core.posit.team
      resources:
        - chronicles/status
        - connects/status
        - flightdecks/status
        - packagemanagers/status
        - postgresdatabases/status
        - sites/status
        - workbenches/status
      verbs:
        - get
        - patch
        - update
    - apiGroups:
        - k8s.keycloak.org
      resources:
        - keycloakrealmimports
        - keycloaks
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - metrics.k8s.io
      resources:
        - pods
      verbs:
        - get
    - apiGroups:
        - networking.k8s.io
      resources:
        - ingresses
        - networkpolicies
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - policy
      resources:
        - poddisruptionbudgets
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - rbac.authorization.k8s.io
      resources:
        - rolebindings
        - roles
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - secrets-store.csi.x-k8s.io
      resources:
        - secretproviderclasses
        - secretsproviderclass
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - traefik.io
      resources:
        - middlewares
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
