apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "team-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
    - apiGroups:
        - ""
      resources:
        - persistentvolumes
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
