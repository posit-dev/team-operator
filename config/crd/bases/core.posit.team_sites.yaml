---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: sites.core.posit.team
spec:
  group: core.posit.team
  names:
    kind: Site
    listKind: SiteList
    plural: sites
    singular: site
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Site is the Schema for the sites API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SiteSpec defines the desired state of Site
            properties:
              awsAccountId:
                description: AwsAccountId is the account Id for this AWS Account.
                  It is used to create EKS-to-IAM annotations
                type: string
              chronicle:
                description: Chronicle contains Posit Chronicle configuration
                properties:
                  addEnv:
                    additionalProperties:
                      type: string
                    type: object
                  agentImage:
                    type: string
                  image:
                    type: string
                  imagePullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  s3Bucket:
                    type: string
                type: object
              clusterDate:
                description: ClusterDate is the date id (YYYYmmdd) for the cluster.
                  It is used to create EKS-to-IAM annotations
                type: string
              connect:
                description: Connect contains Posit Connect configuration
                properties:
                  addEnv:
                    additionalProperties:
                      type: string
                    type: object
                  additionalConfig:
                    description: AdditionalConfig allows appending arbitrary gcfg
                      config content to the generated config.
                    type: string
                  additionalRuntimeImages:
                    description: |-
                      AdditionalRuntimeImages specifies additional runtime images to append to the defaults
                      for Connect off-host execution
                    items:
                      description: ConnectRuntimeImageSpec defines a runtime image
                        for Connect off-host execution
                      properties:
                        osVersion:
                          description: OSVersion is the OS version (e.g., "ubuntu2204")
                          minLength: 1
                          type: string
                        pyVersion:
                          description: PyVersion is the Python version (e.g., "3.13.9")
                          minLength: 1
                          type: string
                        quartoVersion:
                          description: QuartoVersion is the Quarto version (e.g.,
                            "1.8.25")
                          minLength: 1
                          type: string
                        rVersion:
                          description: RVersion is the R version (e.g., "4.5.2")
                          minLength: 1
                          type: string
                        repo:
                          default: ghcr.io/rstudio/content-pro
                          description: Repo is the container image repository (e.g.,
                            "ghcr.io/rstudio/content-pro")
                          type: string
                      required:
                      - osVersion
                      - pyVersion
                      - quartoVersion
                      - rVersion
                      type: object
                    type: array
                  auth:
                    properties:
                      administratorRoleMapping:
                        items:
                          type: string
                        type: array
                      clientId:
                        type: string
                      disableGroupsClaim:
                        type: boolean
                      emailClaim:
                        type: string
                      groups:
                        type: boolean
                      groupsClaim:
                        type: string
                      issuer:
                        type: string
                      publisherRoleMapping:
                        items:
                          type: string
                        type: array
                      samlEmailAttribute:
                        type: string
                      samlFirstNameAttribute:
                        type: string
                      samlIdPAttributeProfile:
                        description: SAML-specific attribute mappings (mutually exclusive
                          with SamlIdPAttributeProfile)
                        type: string
                      samlLastNameAttribute:
                        type: string
                      samlMetadataUrl:
                        type: string
                      samlUsernameAttribute:
                        type: string
                      scopes:
                        items:
                          type: string
                        type: array
                      type:
                        type: string
                      uniqueIdClaim:
                        type: string
                      usernameClaim:
                        type: string
                      viewerRoleMapping:
                        items:
                          type: string
                        type: array
                    type: object
                  baseDomain:
                    description: |-
                      BaseDomain overrides site.Spec.Domain for this product's URL construction.
                      When set, the product URL will be: domainPrefix.baseDomain
                    type: string
                  databaseSettings:
                    properties:
                      instrumentationSchema:
                        type: string
                      schema:
                        type: string
                    type: object
                  databricks:
                    properties:
                      clientId:
                        type: string
                      name:
                        type: string
                      tenantId:
                        type: string
                      url:
                        type: string
                    type: object
                  domainPrefix:
                    default: connect
                    type: string
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether Connect is running. Defaults to true.
                      Setting to false suspends Connect: stops pods and removes ingress/service,
                      but preserves PVC, database, and secrets so data is retained.
                      Re-enabling restores full service without data loss.
                    type: boolean
                  experimentalFeatures:
                    properties:
                      chronicleSidecarProductApiKeyEnabled:
                        description: |-
                          ChronicleSidecarProductApiKeyEnabled assumes the api key for this product has been added to a secret and
                          injects the secret as an environment variable to the sidecar
                        type: boolean
                      dsnSecret:
                        description: DsnSecret is a key for the default SiteSecretType
                          to embed in sessions as a DSN (/etc/odbc.ini)
                        type: string
                      mailDisplayName:
                        description: MailDisplayName Is the display name of the server
                          in the email subject
                        type: string
                      mailSender:
                        description: MailSender enables SMTP and sets the sender email
                          address
                        type: string
                      mailTarget:
                        description: MailTarget sets the target email address. Can
                          be useful for avoiding junk mail
                        type: string
                      sessionEnvVars:
                        description: SessionEnvVars is a map of environment variables
                          to set in the session pods
                        items:
                          description: EnvVar represents an environment variable present
                            in a Container.
                          properties:
                            name:
                              description: |-
                                Name of the environment variable.
                                May consist of any printable ASCII characters except '='.
                              type: string
                            value:
                              description: |-
                                Variable references $(VAR_NAME) are expanded
                                using the previously defined environment variables in the container and
                                any service environment variables. If a variable cannot be resolved,
                                the reference in the input string will be unchanged. Double $$ are reduced
                                to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                                "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                                Escaped references will never be expanded, regardless of whether the variable
                                exists or not.
                                Defaults to "".
                              type: string
                            valueFrom:
                              description: Source for the environment variable's value.
                                Cannot be used if value is not empty.
                              properties:
                                configMapKeyRef:
                                  description: Selects a key of a ConfigMap.
                                  properties:
                                    key:
                                      description: The key to select.
                                      type: string
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    optional:
                                      description: Specify whether the ConfigMap or
                                        its key must be defined
                                      type: boolean
                                  required:
                                  - key
                                  type: object
                                  x-kubernetes-map-type: atomic
                                fieldRef:
                                  description: |-
                                    Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                    spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                  properties:
                                    apiVersion:
                                      description: Version of the schema the FieldPath
                                        is written in terms of, defaults to "v1".
                                      type: string
                                    fieldPath:
                                      description: Path of the field to select in
                                        the specified API version.
                                      type: string
                                  required:
                                  - fieldPath
                                  type: object
                                  x-kubernetes-map-type: atomic
                                fileKeyRef:
                                  description: |-
                                    FileKeyRef selects a key of the env file.
                                    Requires the EnvFiles feature gate to be enabled.
                                  properties:
                                    key:
                                      description: |-
                                        The key within the env file. An invalid key will prevent the pod from starting.
                                        The keys defined within a source may consist of any printable ASCII characters except '='.
                                        During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                      type: string
                                    optional:
                                      default: false
                                      description: |-
                                        Specify whether the file or its key must be defined. If the file or key
                                        does not exist, then the env var is not published.
                                        If optional is set to true and the specified key does not exist,
                                        the environment variable will not be set in the Pod's containers.

                                        If optional is set to false and the specified key does not exist,
                                        an error will be returned during Pod creation.
                                      type: boolean
                                    path:
                                      description: |-
                                        The path within the volume from which to select the file.
                                        Must be relative and may not contain the '..' path or start with '..'.
                                      type: string
                                    volumeName:
                                      description: The name of the volume mount containing
                                        the env file.
                                      type: string
                                  required:
                                  - key
                                  - path
                                  - volumeName
                                  type: object
                                  x-kubernetes-map-type: atomic
                                resourceFieldRef:
                                  description: |-
                                    Selects a resource of the container: only resources limits and requests
                                    (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                  properties:
                                    containerName:
                                      description: 'Container name: required for volumes,
                                        optional for env vars'
                                      type: string
                                    divisor:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: Specifies the output format of
                                        the exposed resources, defaults to "1"
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    resource:
                                      description: 'Required: resource to select'
                                      type: string
                                  required:
                                  - resource
                                  type: object
                                  x-kubernetes-map-type: atomic
                                secretKeyRef:
                                  description: Selects a key of a secret in the pod's
                                    namespace
                                  properties:
                                    key:
                                      description: The key of the secret to select
                                        from.  Must be a valid secret key.
                                      type: string
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    optional:
                                      description: Specify whether the Secret or its
                                        key must be defined
                                      type: boolean
                                  required:
                                  - key
                                  type: object
                                  x-kubernetes-map-type: atomic
                              type: object
                          required:
                          - name
                          type: object
                        type: array
                      sessionImagePullPolicy:
                        description: SessionImagePullPolicy is the image pull policy
                          for session pods
                        type: string
                      sessionServiceAccountName:
                        description: |-
                          SessionServiceAccountName is the name of the service account to use as default for ALL session pods.
                          This can be overwritten in the UI
                        type: string
                    type: object
                  gpuSettings:
                    description: GPUSettings allows configuring GPU resource requests
                      and limits
                    properties:
                      amdGPULimit:
                        type: integer
                      maxAMDGPULimit:
                        type: integer
                      maxNvidiaGPULimit:
                        type: integer
                      nvidiaGPULimit:
                        type: integer
                    type: object
                  image:
                    type: string
                  imagePullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                  license:
                    properties:
                      existingSecretKey:
                        type: string
                      existingSecretName:
                        type: string
                      key:
                        type: string
                      type:
                        type: string
                    type: object
                  loggedInWarning:
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  publicWarning:
                    type: string
                  registerOnFirstLogin:
                    description: |-
                      RegisterOnFirstLogin controls whether new users are automatically registered
                      when they first log in via OAuth2/OIDC. Only applies when auth type is "oidc".
                    type: boolean
                  replicas:
                    type: integer
                  scheduleConcurrency:
                    default: 2
                    minimum: 0
                    type: integer
                  sessionImage:
                    type: string
                  teardown:
                    default: false
                    description: |-
                      Teardown permanently destroys all Connect resources including the database,
                      secrets, and persistent volume claim. Only takes effect when Enabled is false.
                      Re-enabling after teardown starts fresh with a new empty database.
                    type: boolean
                  volume:
                    description: VolumeSpec is a specification for a PersistentVolumeClaim
                      to be created (and/or mounted)
                    properties:
                      accessModes:
                        description: AccessModes is the access mode for the created
                          PVC. Only used if Create is true
                        items:
                          type: string
                        type: array
                      create:
                        description: Create determines whether the PVC should be created
                          or not
                        type: boolean
                      mountPath:
                        description: MountPath is not always used. It is only used
                          for volumes that are configurable... (i.e. additionalVolumes)
                        type: string
                      pvcName:
                        description: PvcName is used only if Create is false. The
                          idea is that the PVC has already been created. Only used
                          if Create is false
                        type: string
                      readOnly:
                        description: ReadOnly defaults to false and determines whether
                          the volume is mounted ReadOnly
                        type: boolean
                      size:
                        description: Size is the size of the PVC that is being created.
                          Only used if Create is true
                        type: string
                      storageClassName:
                        description: StorageClassName identifies the StorageClassName
                          created by the PV. Only used if Create is true
                        type: string
                      volumeName:
                        description: VolumeName is the name of the PV that will be
                          referenced by the created PVC. Only used if Create is true
                        type: string
                    type: object
                type: object
              debug:
                type: boolean
              disablePrePullImages:
                type: boolean
              domain:
                description: Domain is the core domain name associated with the Posit
                  Team Site
                type: string
              dropDatabaseOnTearDown:
                type: boolean
              efsEnabled:
                description: |-
                  EFSEnabled indicates whether EFS is enabled for this site
                  When true, network policies will allow workbench sessions to access EFS mount targets
                type: boolean
              enableFqdnHealthChecks:
                default: true
                description: |-
                  EnableFQDNHealthChecks controls whether Grafana Alloy generates FQDN-based health check targets
                  for this site's products. When false, only internal cluster health checks are generated.
                  Defaults to true.
                type: boolean
              extraSiteServiceAccounts:
                description: ExtraSiteServiceAccounts will be prefixed by "<siteName>-"
                  and created as service accounts in Kubernetes
                items:
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      type: object
                    nameSuffix:
                      type: string
                  type: object
                type: array
              flightdeck:
                description: Flightdeck contains Flightdeck configuration
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether Flightdeck is deployed. Defaults to true if not specified.
                      Set to false to explicitly disable Flightdeck deployment.
                    type: boolean
                  featureEnabler:
                    description: FeatureEnabler controls which features are enabled
                      in Flightdeck
                    properties:
                      showAcademy:
                        default: false
                        description: ShowAcademy enables the academy page
                        type: boolean
                      showConfig:
                        default: false
                        description: ShowConfig enables the configuration page
                        type: boolean
                    type: object
                  image:
                    description: |-
                      Image is the container image for Flightdeck.
                      Can be a tag (e.g., "v1.2.3") which will be combined with the default registry,
                      or a full image path (e.g., "my-registry.io/flightdeck:v1.0.0").
                      Defaults to "docker.io/posit/ptd-flightdeck:latest" if not specified.
                    type: string
                  imagePullPolicy:
                    description: ImagePullPolicy controls when the kubelet pulls the
                      image
                    type: string
                  logFormat:
                    default: text
                    description: LogFormat sets the log output format (text, json)
                    type: string
                  logLevel:
                    default: info
                    description: LogLevel sets the logging verbosity (debug, info,
                      warn, error)
                    type: string
                  replicas:
                    description: Replicas is the number of Flightdeck pods to run
                    type: integer
                type: object
              imagePullSecrets:
                description: |-
                  ImagePullSecrets is a set of image pull secrets to use for all image pulls. These names / secrets
                  must already exist in the namespace in question.
                items:
                  type: string
                type: array
              ingressAnnotations:
                additionalProperties:
                  type: string
                description: IngressAnnotations is a set of annotations to be applied
                  to all ingress routes
                type: object
              ingressClass:
                description: IngressClass is the ingress class to be used when creating
                  ingress routes
                type: string
              keycloak:
                description: Keycloak contains the Keycloak configuration details
                properties:
                  enabled:
                    type: boolean
                  image:
                    type: string
                  imagePullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              logFormat:
                type: string
              mainDatabaseCredentialSecret:
                description: MainDatabaseCredentialSecret configures the secret used
                  for storing the main database credentials
                properties:
                  type:
                    type: string
                  vaultName:
                    type: string
                type: object
              networkTrust:
                default: 100
                maximum: 100
                minimum: 0
                type: integer
              packageManager:
                description: PackageManager contains Posit Package Manager configuration
                properties:
                  addEnv:
                    additionalProperties:
                      type: string
                    type: object
                  additionalConfig:
                    description: AdditionalConfig allows appending arbitrary gcfg
                      config content to the generated config.
                    type: string
                  azureFiles:
                    description: AzureFiles configures Azure Files integration for
                      persistent storage
                    properties:
                      shareSizeGiB:
                        description: ShareSizeGiB is the size of the Azure File Share
                          to create
                        type: integer
                      storageClassName:
                        description: StorageClassName is the name of the Kubernetes
                          StorageClass that uses the Azure Files CSI driver
                        type: string
                    type: object
                  baseDomain:
                    description: |-
                      BaseDomain overrides site.Spec.Domain for this product's URL construction.
                      When set, the product URL will be: domainPrefix.baseDomain
                    type: string
                  domainPrefix:
                    default: packagemanager
                    type: string
                  gitSSHKeys:
                    description: |-
                      GitSSHKeys defines SSH key configurations for Git authentication in Package Manager
                      These SSH keys will be made available to Package Manager for Git Builders
                    items:
                      description: SSHKeyConfig defines SSH key configuration for
                        Git authentication
                      properties:
                        host:
                          description: |-
                            Host is the Git host domain this key applies to
                            Example: "github.com"
                          type: string
                        name:
                          description: Name is a unique identifier for this SSH key
                            configuration
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        passphraseSecretRef:
                          description: PassphraseSecretRef optionally references a
                            secret containing the passphrase for an encrypted SSH
                            key
                          properties:
                            key:
                              description: |-
                                Key is the specific key within the secret (primarily for Kubernetes secrets)
                                For AWS/Azure: usually not needed as the entire secret is used
                                For Kubernetes: the key within the Secret data
                              type: string
                            name:
                              description: |-
                                Name is the secret name
                                For AWS: secret name in AWS Secrets Manager (e.g., "ptd/cluster/packagemanager/ssh/github")
                                For Kubernetes: secret name in the same namespace
                                For Azure: key vault secret name
                              minLength: 1
                              type: string
                            source:
                              description: Source specifies the secret management
                                system
                              enum:
                              - aws-secrets-manager
                              - kubernetes
                              - azure-key-vault
                              type: string
                          required:
                          - name
                          - source
                          type: object
                        secretRef:
                          description: SecretRef references the secret containing
                            the SSH private key
                          properties:
                            key:
                              description: |-
                                Key is the specific key within the secret (primarily for Kubernetes secrets)
                                For AWS/Azure: usually not needed as the entire secret is used
                                For Kubernetes: the key within the Secret data
                              type: string
                            name:
                              description: |-
                                Name is the secret name
                                For AWS: secret name in AWS Secrets Manager (e.g., "ptd/cluster/packagemanager/ssh/github")
                                For Kubernetes: secret name in the same namespace
                                For Azure: key vault secret name
                              minLength: 1
                              type: string
                            source:
                              description: Source specifies the secret management
                                system
                              enum:
                              - aws-secrets-manager
                              - kubernetes
                              - azure-key-vault
                              type: string
                          required:
                          - name
                          - source
                          type: object
                      required:
                      - host
                      - name
                      - secretRef
                      type: object
                    type: array
                  image:
                    type: string
                  imagePullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                  license:
                    properties:
                      existingSecretKey:
                        type: string
                      existingSecretName:
                        type: string
                      key:
                        type: string
                      type:
                        type: string
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  replicas:
                    type: integer
                  s3Bucket:
                    type: string
                  volume:
                    description: VolumeSpec is a specification for a PersistentVolumeClaim
                      to be created (and/or mounted)
                    properties:
                      accessModes:
                        description: AccessModes is the access mode for the created
                          PVC. Only used if Create is true
                        items:
                          type: string
                        type: array
                      create:
                        description: Create determines whether the PVC should be created
                          or not
                        type: boolean
                      mountPath:
                        description: MountPath is not always used. It is only used
                          for volumes that are configurable... (i.e. additionalVolumes)
                        type: string
                      pvcName:
                        description: PvcName is used only if Create is false. The
                          idea is that the PVC has already been created. Only used
                          if Create is false
                        type: string
                      readOnly:
                        description: ReadOnly defaults to false and determines whether
                          the volume is mounted ReadOnly
                        type: boolean
                      size:
                        description: Size is the size of the PVC that is being created.
                          Only used if Create is true
                        type: string
                      storageClassName:
                        description: StorageClassName identifies the StorageClassName
                          created by the PV. Only used if Create is true
                        type: string
                      volumeName:
                        description: VolumeName is the name of the PV that will be
                          referenced by the created PVC. Only used if Create is true
                        type: string
                    type: object
                type: object
              packageManagerUrl:
                description: |-
                  PackageManagerUrl specifies the Package Manager URL for Workbench to use
                  If empty, Workbench will use the local Package Manager URL by default
                type: string
              secret:
                description: Secret configures the secret management for this Site
                properties:
                  type:
                    type: string
                  vaultName:
                    type: string
                type: object
              secretType:
                description: |-
                  SecretType is the type of secret that we should use to store values (i.e. database passwords)
                  *NOTE*: this field is deprecated and will be removed in the future
                type: string
              sharedDirectory:
                description: |-
                  SharedDirectory is the name of a directory mounted into Workbench and Connect at /mnt/<sharedDirectory>. It should
                  NOT contain any slashes.
                type: string
              volumeSource:
                description: |-
                  VolumeSource is a definition of where volumes should be created from. Usually a site targets a single
                  shared resource (i.e. FSx instance) to provision all of its shared data
                properties:
                  dnsName:
                    type: string
                  type:
                    type: string
                  volumeId:
                    type: string
                type: object
              volumeSubdirJobOff:
                description: VolumeSubdirJobOff turns off the VolumeSubdir provisioning
                  kubernetes job
                type: boolean
              vpcCIDR:
                description: VPCCIDR is the CIDR block for the VPC, used for EFS network
                  policies
                type: string
              workbench:
                description: Workbench contains Posit Workbench configuration
                properties:
                  addEnv:
                    additionalProperties:
                      type: string
                    type: object
                  additionalConfigs:
                    additionalProperties:
                      type: string
                    description: |-
                      AdditionalConfigs allows appending arbitrary content to Workbench server config files.
                      Keys are config file names (e.g., "rserver.conf", "launcher.conf").
                    type: object
                  additionalSessionConfigs:
                    additionalProperties:
                      type: string
                    description: |-
                      AdditionalSessionConfigs allows appending arbitrary content to Workbench session config files.
                      Keys are config file names (e.g., "rsession.conf", "repos.conf").
                    type: object
                  additionalVolumes:
                    description: AdditionalVolumes represents additional VolumeSpec's
                      that can be defined for Workbench
                    items:
                      description: VolumeSpec is a specification for a PersistentVolumeClaim
                        to be created (and/or mounted)
